<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Testes de interpretação PF — NEJLON</title><style>body{font:16px Arial;padding:24px;background:#f6f6f6;color:#111}h1{border-bottom:6px solid red;padding-bottom:12px}.pass{color:#075b2b}.fail{color:#ad0000}li{margin:10px 0}pre{background:#fff;padding:12px;overflow:auto}</style><h1>TESTES DO INTERPRETADOR FINANCEIRO</h1><p>Executa localmente no navegador, sem IA paga. Casos sintéticos de estruturas variadas; não substituem a validação com XLSX reais.</p><ol id="results"></ol><p id="summary"></p><script src="./pf-financial-parser.js?v=free-rules-v3"></script><script>
const tests=[
{name:"Projeções em aba padrão",sheets:[{name:"Painel de projeções",rows:[["Indicador","Pessimista","Realista","Otimista"],["Total receitas",100,200,300],["Total despesas",80,120,150],["Saldo",20,80,150]]}],count:1,realistic:80},
{name:"Projeções em aba sem nome padrão e cabeçalho deslocado",sheets:[{name:"Plan1",rows:[["Evento 2027"],[],["Dados financeiros"],["Indicador","Pessimista","Realista","Otimista"],["RECEITAS",100,200,300],["DESPESAS",70,120,210],["SALDO FINAL",30,80,90]]}],count:1,realistic:80},
{name:"Duas abas de propostas",sheets:[{name:"C1",rows:[["","Pessimista","Realista","Otimista"],["Total receitas",100,200,300],["Total despesas",80,110,150]]},{name:"C2",rows:[["","Pessimista","Realista","Otimista"],["Total receitas",200,400,500],["Total despesas",150,300,350]]}],count:2},
{name:"Dois blocos em uma aba",sheets:[{name:"Financeiro",rows:[["C1"],["","Pessimista","Realista","Otimista"],["Receitas",100,200,300],["Despesas",50,120,140],[],["C2"],["","Pessimista","Realista","Otimista"],["Receitas",300,400,500],["Despesas",150,210,250]]}],count:2},
{name:"Valores brasileiros e saldo negativo",sheets:[{name:"Valores",rows:[["","Pessimista","Realista","Otimista"],["Receitas","1.000,00","2.000,00","3.000,00"],["Despesas","1.500,00","1.700,00","2.400,00"]]}],count:1,realistic:300},
{name:"Falta de despesas: não inventar números",sheets:[{name:"Incompleto",rows:[["","Pessimista","Realista","Otimista"],["Receitas",100,200,300]]}],count:0},
{name:"Saldo inconsistente: avisar",sheets:[{name:"Divergência",rows:[["","Pessimista","Realista","Otimista"],["Receitas",100,200,300],["Despesas",70,100,120],["Saldo",30,200,180]]}],count:1,warn:true}
];
let passed=0;for(const t of tests){try{const r=window.NEJLON_PF_PARSER.parse(t.sheets),ok=r.alternatives.length===t.count&&(t.realistic===undefined||Math.abs(r.alternatives[0].projections.realistic.balance-t.realistic)<0.01)&&(!t.warn||r.warnings.some(w=>/diverg/i.test(w)));if(ok)passed++;document.getElementById("results").insertAdjacentHTML("beforeend",'<li class="'+(ok?'pass':'fail')+'">'+(ok?'PASSOU':'FALHOU')+' — '+t.name+' ('+r.alternatives.length+' propostas; '+r.warnings.length+' avisos)</li>')}catch(e){document.getElementById("results").insertAdjacentHTML("beforeend",'<li class="fail">ERRO — '+t.name+': '+String(e.message)+'</li>')}}document.getElementById("summary").textContent=passed+'/'+tests.length+' testes passaram.';
</script>
