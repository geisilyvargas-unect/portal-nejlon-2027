<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar gestão — NEJLON</title><link rel="stylesheet" href="../pages/site.css"><link rel="stylesheet" href="../pages/ux-system.css"><script defer src="./gestao.js"></script><script defer src="./representantes.js"></script></head><body><main style="max-width:900px;margin:5vh auto;padding:24px"><section class="panel"><a href="./index.html">← Portal institucional</a><h1>GERENCIAR GESTÃO</h1><p id="status" role="status"></p><section id="workspace" hidden><h2 id="year"></h2><p id="count"></p><label>Buscar EJ <input id="search" type="search"></label><div id="roster" style="max-height:400px;overflow:auto"></div><label>Justificativa da alteração <textarea id="reason" required></textarea></label><p><button id="prepare" class="btn">Importar gestão anterior</button> <button id="save" class="btn">Salvar composição</button> <button id="confirm" class="btn red">Confirmar composição</button></p><details><summary>Cadastrar nova EJ</summary><form id="register"><label>Nome <input name="name" required maxlength="120"></label><label>Identificador <input name="slug" required pattern="[a-z0-9][a-z0-9-]{1,59}"></label><label>Justificativa <input name="reason" required minlength="3"></label><button class="btn red">Cadastrar EJ</button></form><p>Após cadastrar, selecione a EJ na composição e confirme a gestão.</p></details><p>Alterações não modificam a lista de EJs de deliberações já abertas.</p></section></section><section class="panel" id="representatives" hidden><h2>Representantes do Conselho</h2><p id="rep-status" role="status"></p><form id="rep-form"><label>EJ <select id="rep-ej" required></select></label><p id="rep-current"></p><label>Representante cadastrado <select id="rep-new" required></select></label><label>Justificativa <textarea id="rep-reason" required minlength="3"></textarea></label><button class="btn red">Confirmar substituição</button></form><p>A substituição desativa o acesso anterior e preserva os registros da EJ.</p></section></main></body></html>
