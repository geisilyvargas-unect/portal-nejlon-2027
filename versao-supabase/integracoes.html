<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integrações · NEJLON</title><link rel="stylesheet" href="../pages/site.css"><link rel="stylesheet" href="../pages/ux-system.css"><script defer src="./integracoes.js"></script></head><body><main style="max-width:760px;margin:32px auto;padding:24px"><h1>Central de integrações</h1><p>Ambiente institucional · PRESCON</p><form id="login"><label>E-mail <input type="email" name="email" required autocomplete="username"></label><label>Senha <input type="password" name="password" required autocomplete="current-password"></label><button class="btn red">Entrar</button></form><section id="tools" hidden><button id="logout">Sair</button><h2>Google</h2><button id="connect">Autorizar conta Google</button><button id="drive">Criar pasta institucional</button><h2>Calendar</h2><button id="calendar">Criar calendário exclusivo</button><form id="test"><label>ID do calendário <input name="calendarId" required></label><label>E-mails de teste (até quatro, separados por vírgula)<textarea name="emails" required></textarea></label><label><input type="checkbox" required name="confirm"> Confirmo o envio real somente a contas autorizadas para teste.</label><button>Enviar convite de teste</button></form></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
