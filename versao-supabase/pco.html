<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCO anônima</title><link rel="stylesheet" href="../pages/site.css"><main class="panel" style="max-width:700px;margin:30px auto;padding:24px"><h1>Pesquisa de Clima Organizacional</h1><p>Não informe nomes ou dados pessoais. Respostas sem identificação no banco; resultados agregados após encerramento, com mínimo de cinco respostas. Não há garantia de resposta única.</p><form id="form"><label>Ciclo <select id="cycle" required></select></label><div id="questions"></div><button class="btn red">Enviar</button></form><p id="status" role="status"></p></main><script>const base='https://imsisbixzkqphooxyfhr.supabase.co/rest/v1/',key='sb_publishable_mS_TDGKZhUuJi-rxc5Nu1w_IXODeo-_',headers={apikey:key,'Content-Type':'application/json',Prefer:'return=minimal'},q=['Sinto que tenho espaço para contribuir','A comunicação do Conselho é clara','Recebo suporte adequado','As atividades são relevantes','O ambiente favorece colaboração'];const f=document.querySelector('form'),c=document.querySelector('#cycle'),status=document.querySelector('#status');q.forEach(t=>{const l=document.createElement('label');l.textContent=t;l.style.display='block';const s=document.createElement('select');s.required=true;s.add(new Option('Selecione',''));['Discordo totalmente','Discordo parcialmente','Neutro','Concordo parcialmente','Concordo totalmente'].forEach((v,i)=>s.add(new Option(v,i+1)));l.append(s);document.querySelector('#questions').append(l)});fetch(base+'pco_cycles?select=id,management_year,month',{headers}).then(async r=>{if(!r.ok)throw Error('Consulta indisponível');const rows=await r.json();rows.forEach(x=>c.add(new Option(x.management_year+' / '+x.month,x.id)));if(!rows.length){f.hidden=true;status.textContent='Nenhum ciclo aberto'}}).catch(e=>{f.hidden=true;status.textContent=e.message});f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const r=await fetch(base+'pco_responses',{method:'POST',headers,body:JSON.stringify({cycle_id:c.value,answers:[...document.querySelectorAll('#questions select')].map(x=>Number(x.value))})});if(!r.ok)throw Error('Envio recusado');f.hidden=true;status.textContent='Resposta registrada.'}catch(e){status.textContent=e.message;b.disabled=false}};</script></html>
